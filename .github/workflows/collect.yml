# Collects the paper-trading record without a machine of our own running.
#
# The bet history lives in git as CSV (data/bets.csv, data/odds_snapshots.csv);
# the SQLite file is a local artifact and is not committed. So each run rebuilds
# the database from the CSVs, does its work, exports, and commits the result.
#
# Budget: 36 runs a day at roughly 2 minutes each is about 2200 minutes a month,
# which fits a public repository (unlimited) and is close to the 2000-minute free
# allowance on a private one. Widen the cron if that matters.

name: collect

on:
  # The first push of this file runs the reachability probe, which is the point
  # of the exercise: we do not know whether Nike answers a runner abroad.
  push:
    paths: ['.github/workflows/collect.yml']
  schedule:
    - cron: '*/30 6-23 * * *'
  workflow_dispatch:
    inputs:
      probe_only:
        description: 'Only check reachability, collect nothing'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Runs commit to the same files, so they must not overlap. Queue instead of
  # cancelling: a cancelled run could lose a closing snapshot it had just taken.
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Does Nike answer from here at all? Nike serves a different mitigation
      # mode by country, and a runner is not in Slovakia. The answer is written
      # to a file and committed so it can be read without access to these logs.
      - name: Probe reachability
        id: probe
        continue-on-error: true
        run: |
          {
            echo "# Dostupnosť Niké z GitHub runnera"
            echo
            echo "Posledný pokus: $(date -u '+%Y-%m-%d %H:%M') UTC"
            echo
            echo '```'
            bash tools/probe_access.sh 2>&1 || echo "PROBE ZLYHAL"
            echo '```'
          } > data/runner-check.md
          python tools/nike_odds.py check > /dev/null 2>&1

      - name: Rebuild database from the committed record
        if: steps.probe.outcome == 'success' && inputs.probe_only != true
        run: python tools/history.py import --dir data --force

      - name: Record what is startable soon
        if: steps.probe.outcome == 'success' && inputs.probe_only != true
        run: |
          for sport in tennis darts snooker basketball; do
            echo "::group::$sport"
            python tools/consensus.py compare --sport "$sport" -f csv \
              --days 1 --max-spread 0.10 2>&1 \
              | python tools/history.py bulk-add || echo "preskočené: $sport"
            echo "::endgroup::"
          done

      # The one snapshot that cannot be missed: after the start the price is gone.
      - name: Snapshot bets about to start
        if: steps.probe.outcome == 'success' && inputs.probe_only != true
        run: python tools/history.py refresh --starting-within 90

      - name: Settle what has finished
        if: steps.probe.outcome == 'success' && inputs.probe_only != true
        run: python tools/history.py settle

      - name: Export back to CSV
        if: steps.probe.outcome == 'success' && inputs.probe_only != true
        run: python tools/history.py export

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "nič nové"
            exit 0
          fi
          git commit -m "collect: $(date -u '+%Y-%m-%d %H:%M') UTC [skip ci]"
          # Another run may have pushed while this one worked.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1

      - name: Fail if Nike was unreachable
        if: steps.probe.outcome != 'success'
        run: |
          echo "Niké neodpovedalo z runnera — pozri data/runner-check.md"
          exit 1
